<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Monochord</title>
    
    <style>
        /* Forcing GitHub to fetch the Premium Google Fonts natively */
        @import url('https://googleapis.com');

        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            
            /* Enhanced 3% Contrast Crushed Paper Optical Illusion */
            background-color: ##F2E1AD; 
            background-image: 
                radial-gradient(rgba(30, 41, 59, 0.03) 1.5px, transparent 0),
                radial-gradient(rgba(30, 41, 59, 0.02) 1.5px, transparent 0);
            background-size: 12px 12px;
            background-position: 0 0, 6px 6px;
            
            color: #1E293B; /* Deep Indigo Slate */
            overflow: hidden;
        }

        /* Dotted Title with the Cinematic Focus-Pulse Animation */
        h1 {
            font-family: 'Codystar', sans-serif;
            font-size: 3.8rem;
            margin: 0 0 20px 0;
            font-weight: 400;
            color: #1E293B;
            
            /* Activating the new animation block */
            animation: focusPulse 3s cubic-bezier(0.25, 1, 0.5, 1) forwards;
            opacity: 0;
        }

        /* Typewriter Subtext stays with the clean clarifying fade */
        p {
            font-family: 'Special Elite', monospace;
            font-size: 1.1rem;
            margin: 0;
            letter-spacing: 1px;
            color: #475569;
            max-width: 600px;
            line-height: 1.6;
            
            /* Delayed so it drops in right after the title clarifies */
            animation: clarifyFade 2.5s ease-out 1.5s forwards;
            opacity: 0;
            filter: blur(4px);
        }

        /* NEW ANIMATION: The Focus-Pulse Title Entrance */
        @keyframes focusPulse {
            0% {
                opacity: 0;
                letter-spacing: 16px; /* Starts completely spaced out */
                filter: blur(12px);    /* Heavily out of focus */
                transform: scale(1.05);
            }
            60% {
                opacity: 0.8;
                filter: blur(4px);
            }
            100% {
                opacity: 1;
                letter-spacing: 4px;  /* Pulls tightly together into sharp dots */
                filter: blur(0px);     /* Crystal clear */
                transform: scale(1);
            }
        }

        /* The Classic Clarifying Fade-In for Typewriter Subtext */
        @keyframes clarifyFade {
            0% {
                opacity: 0;
                filter: blur(6px);
            }
            100% {
                opacity: 1;
                filter: blur(0px);
            }
        }
    </style>
</head>
<body>

    <h1 class="dotted-title" aria-label="Project Monochord">Project Monochord</h1>
    <p>Translating Data Waves into Financial Literacy for Visually Impaired Youth</p>

</body>
</html>
